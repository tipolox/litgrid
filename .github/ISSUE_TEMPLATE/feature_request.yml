name: Feature request
description: Propose an improvement or new capability for LitGrid
title: "[Feature] "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement. For larger API or architecture changes, describing the use case and tradeoffs is more useful than jumping directly to an implementation.

  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What problem are you trying to solve?
      placeholder: Describe the developer or user need.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the behavior or API you would like to see.
      placeholder: Explain the desired outcome. API sketches are welcome.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Core
        - Renderer
        - Web Component
        - React
        - Angular
        - Vue
        - Blazor
        - Accessibility
        - Performance
        - Architecture
        - Documentation
        - Multiple / Not sure
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What workarounds or alternate approaches have you considered?

  - type: textarea
    id: impact
    attributes:
      label: Compatibility and performance considerations
      description: Note any public API, virtualization, rendering, accessibility, or performance implications you can foresee.

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues for similar requests.
          required: true
        - label: I understand that breaking public API changes should be discussed before implementation.
          required: true
