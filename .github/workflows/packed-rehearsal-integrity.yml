name: Packed rehearsal artifact integrity

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/packed-rehearsal-integrity.yml'
      - 'scripts/qualification/**'
      - 'scripts/compat/**'

permissions:
  contents: read
  actions: read

jobs:
  packed-consumers:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Download exact rehearsal artifacts
        uses: actions/download-artifact@v4
        with:
          name: litgrid-1.2.3-release-candidate
          run-id: 43004797435
          github-token: ${{ github.token }}
          path: rehearsal
      - name: Verify pinned artifact checksums
        working-directory: rehearsal
        run: |
          set -euo pipefail
          cat > expected.txt <<'EOF'
          d12fdfc24499c992a35d2893e37e3511d5fb300e9d228532dbad8ac55faa3bc4  npm/tipolox-litgrid-angular-1.2.3.tgz
          882bf47f0ee1c96343eb002570740690ec7ab55d5fda0f3ecbd6411563040e5c  npm/tipolox-litgrid-core-1.2.3.tgz
          3a45f932554c9c7e905ba817670966714149ecbfd575cb8260fe62abd0a41e68  npm/tipolox-litgrid-react-1.2.3.tgz
          0c4a4d1f6b6b3407296da025fd9f3b12d4cf1e15f65944a65dc8a1d361caf945  npm/tipolox-litgrid-renderer-1.2.3.tgz
          77af28d7b950a7f028f4b708db48c60027a9585f1a33bea651a90bcecfdc8a29  npm/tipolox-litgrid-vue-1.2.3.tgz
          8b7fda58ec6f96e92597aa6edd072a3816b97234e0cf958b336a972940da3642  npm/tipolox-litgrid-web-1.2.3.tgz
          d18be38798df39ca22760ece69611afcdbcf1f209f6ada09cb491fbcc2f1c4e9  nuget/Tipolox.LitGrid.Blazor.1.2.3.nupkg
          EOF
          sha256sum --check expected.txt
      - name: Prepare isolated Next and Blazor consumers
        run: |
          set -euo pipefail
          node scripts/qualification/prepare-consumer.mjs "$RUNNER_TEMP/litgrid-consumer" "$GITHUB_WORKSPACE/rehearsal/npm"
          node scripts/qualification/prepare-blazor-consumer.mjs "$RUNNER_TEMP/litgrid-blazor" "$GITHUB_WORKSPACE/rehearsal/nuget"
      - name: Install and inspect packed dependencies
        working-directory: ${{ runner.temp }}/litgrid-consumer
        run: |
          set -euo pipefail
          npm install --legacy-peer-deps --no-audit --no-fund
          npm install --legacy-peer-deps --no-audit --no-fund --no-save playwright@1.64.1
          node "$GITHUB_WORKSPACE/scripts/qualification/check-packed-resolution.mjs" package-lock.json
          npx tsc -p tsconfig.api.json
          npm run build
          npx playwright install --with-deps chromium
      - name: Run React and Blazor browser consumers
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/litgrid-consumer"
          npm run start > "$RUNNER_TEMP/next.log" 2>&1 &
          NEXT_PID=$!
          dotnet "$RUNNER_TEMP/litgrid-blazor/publish/litgrid-blazor.dll" --urls http://127.0.0.1:5207 > "$RUNNER_TEMP/blazor.log" 2>&1 &
          BLAZOR_PID=$!
          trap 'kill "$NEXT_PID" "$BLAZOR_PID" 2>/dev/null || true; cat "$RUNNER_TEMP/next.log" "$RUNNER_TEMP/blazor.log"' EXIT
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:5201/ >/dev/null && curl -fsS http://127.0.0.1:5207/ >/dev/null; then break; fi
            sleep 2
          done
          node "$GITHUB_WORKSPACE/scripts/qualification/consumers-browser.mjs" "$RUNNER_TEMP/litgrid-consumer/node_modules/playwright" "$RUNNER_TEMP/consumer-results.json"
  angular-packed:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - angular: 17
            node: 20.19.0
          - angular: 22
            node: 22.22.3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/download-artifact@v4
        with:
          name: litgrid-1.2.3-release-candidate
          run-id: 43004797435
          github-token: ${{ github.token }}
          path: rehearsal
      - name: Verify pinned artifact checksums
        working-directory: rehearsal
        run: |
          set -euo pipefail
          cat > expected.txt <<'EOF'
          d12fdfc24499c992a35d2893e37e3511d5fb300e9d228532dbad8ac55faa3bc4  npm/tipolox-litgrid-angular-1.2.3.tgz
          882bf47f0ee1c96343eb002570740690ec7ab55d5fda0f3ecbd6411563040e5c  npm/tipolox-litgrid-core-1.2.3.tgz
          3a45f932554c9c7e905ba817670966714149ecbfd575cb8260fe62abd0a41e68  npm/tipolox-litgrid-react-1.2.3.tgz
          0c4a4d1f6b6b3407296da025fd9f3b12d4cf1e15f65944a65dc8a1d361caf945  npm/tipolox-litgrid-renderer-1.2.3.tgz
          77af28d7b950a7f028f4b708db48c60027a9585f1a33bea651a90bcecfdc8a29  npm/tipolox-litgrid-vue-1.2.3.tgz
          8b7fda58ec6f96e92597aa6edd072a3816b97234e0cf958b336a972940da3642  npm/tipolox-litgrid-web-1.2.3.tgz
          d18be38798df39ca22760ece69611afcdbcf1f209f6ada09cb491fbcc2f1c4e9  nuget/Tipolox.LitGrid.Blazor.1.2.3.nupkg
          EOF
          sha256sum --check expected.txt
      - name: Build and run Angular consumer
        env:
          LITGRID_PACKED_DIR: ${{ github.workspace }}/rehearsal/npm
        run: node scripts/compat/angular-consumer-smoke.mjs ${{ matrix.angular }}
