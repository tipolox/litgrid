name: A3 Keyed Selection Baseline (research only)

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/performance/a3-*'
      - '.github/workflows/a3-keyed-baseline.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline:
    name: Core keyed/unkeyed baseline and identity correctness
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build unchanged Grid Core package
        run: pnpm --dir packages/grid-core build
      - name: Record non-gating baseline and enforce identity correctness probes
        run: node --expose-gc scripts/performance/a3-core-baseline.mjs .private/a3/core-baseline.json
      - name: Preserve raw distributions and machine metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: litgrid-a3-core-baseline
          path: .private/a3/core-baseline.json
          if-no-files-found: warn
          retention-days: 14

  hypotheses:
    name: Compare three disposable Core optimization hypotheses
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Compile unmodified baseline and three temporary hypotheses
        run: node scripts/performance/a3-build-variants.mjs
      - name: Confirm real production sources are unchanged
        run: git diff --exit-code -- packages/grid-core/src
      - name: Measure and validate real built Core variants
        run: node --expose-gc scripts/performance/a3-compare-variants.mjs .private/a3/variant-comparison.json
      - name: Upload raw comparable samples
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: litgrid-a3-variant-comparison
          path: .private/a3/variant-comparison.json
          if-no-files-found: warn
          retention-days: 14

  browser:
    name: Browser readiness, first click, scroll and external pages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Time actual Web Component lifecycle and bound virtualized DOM
        run: node scripts/performance/a3-browser-baseline.mjs .private/a3/browser-baseline.json
      - name: Upload browser distributions and environment
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: litgrid-a3-browser-baseline
          path: .private/a3/browser-baseline.json
          if-no-files-found: warn
          retention-days: 14
