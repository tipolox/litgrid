name: Verify

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
          cache: pnpm

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - run: pnpm install --frozen-lockfile
      - name: Typecheck all authored TypeScript and verify project ownership
        run: pnpm typecheck:all
      - name: Typecheck public API and adapter fixtures
        run: node scripts/typecheck-contracts.mjs
      - run: pnpm test --maxWorkers=2
      - run: pnpm run build
      - name: Typecheck published declarations and framework integrations
        run: pnpm exec tsc -p tsconfig.published-contracts.json --pretty false
      - name: Typecheck typed columns in a strict Angular consumer template
        run: pnpm --filter @tipolox/litgrid-angular exec ngc -p ../../tsconfig.typed-columns-angular.json
      - name: Typecheck declarative columns in a strict Vue consumer template
        run: pnpm exec vue-tsc -p tsconfig.vue-columns.json --noEmit --pretty false
      - name: Install Chromium for adapter lifecycle checks
        run: pnpm exec playwright install --with-deps chromium
      - name: Check real framework event lifecycles against built packages
        run: node scripts/check-adapter-events.mjs
      - name: Check Vue declarative columns and workloads in Chromium
        run: node scripts/check-vue-columns.mjs
      - run: dotnet test packages/grid-blazor/tests/Tipolox.LitGrid.Blazor.Tests.csproj -c Release
      - run: dotnet build packages/grid-blazor/src/Tipolox.LitGrid.Blazor.csproj -c Release
