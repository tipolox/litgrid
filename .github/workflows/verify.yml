name: Verify

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Inspect published LitGrid 1.2.2 registry metadata (temporary, PR-only)
        run: |
          node --input-type=module <<'NODE'
          const names = ['core', 'renderer', 'web', 'react'];
          for (const name of names) {
            const pkg = `@tipolox/litgrid-${name}`;
            const response = await fetch(`https://registry.npmjs.org/${encodeURIComponent(pkg)}/1.2.2`);
            if (!response.ok) throw new Error(`${pkg}: registry status ${response.status}`);
            const data = await response.json();
            if (data.version !== '1.2.2' || !/^sha512-[A-Za-z0-9+/]+={0,2}$/.test(data.dist.integrity))
              throw new Error(`${pkg}: invalid npm metadata`);
            console.log(`PUBLISHED_INTEGRITY ${pkg}@1.2.2 ${data.dist.integrity}`);
          }
          NODE
      - run: pnpm install --frozen-lockfile
      - name: Typecheck public API and adapter contracts (root baseline tracked in issue 31)
        run: node scripts/typecheck-contracts.mjs
      - run: pnpm test
      - run: pnpm run build
      - run: dotnet test packages/grid-blazor/tests/Tipolox.LitGrid.Blazor.Tests.csproj -c Release
      - run: dotnet build packages/grid-blazor/src/Tipolox.LitGrid.Blazor.csproj -c Release
