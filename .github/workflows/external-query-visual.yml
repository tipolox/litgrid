name: External Query Visual Regression

on:
  pull_request:
    branches:
      - main
    paths:
      - 'packages/grid-web/src/components/DataGrid.ts'
      - 'packages/grid-web/src/components/DataGrid.externalQuery.test.ts'
      - 'packages/grid-web/src/components/DataGrid.layout.test.ts'
      - 'scripts/external-query-browser-check.mjs'
      - '.github/workflows/external-query-visual.yml'

permissions:
  contents: read

jobs:
  chromium-external-query:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install project dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium with the repository-locked supported Playwright
        # The legacy isolated Playwright 1.56.1 fails to install Chromium on
        # ubuntu26.04-x64. Verify already uses the same workspace version.
        run: pnpm exec playwright install --with-deps chromium

      - name: Verify external-query interactions and zero loading layout shift
        env:
          LITGRID_VISUAL_SCREENSHOTS: '1'
        run: node scripts/external-query-browser-check.mjs

      - name: Upload loading-state screenshots for visual sign-off
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: litgrid-external-loading-visuals
          path: artifacts/litgrid-external-query-visual/*.png
          if-no-files-found: warn
          retention-days: 14
